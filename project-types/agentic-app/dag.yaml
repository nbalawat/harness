# agentic-app — problem statement + documents -> working agentic application.
# v0.3.0: VERTICAL SLICES — after the walking-skeleton scaffold, the app is
# built feature-by-feature (slice-plan derives 1-6 end-to-end slices from the
# requirements; each slice node activates only if its slice exists, carries
# its own acceptance verification, and commits a launchable app).
# v0.12.0: PARALLEL BUILD — slice-1 is the foundation; slices 2..6 build
# CONCURRENTLY on top of it (engine runs the whole ready frontier in
# parallel), then merge-slices unions the trees deterministically (line-level
# three-way merge; conflicts fail loudly, never LLM-resolved) and
# verify-merged re-proves every slice's acceptance cumulatively. Design
# options are three concurrent nodes off a shared screen inventory. A single
# post-merge slice-audit replaces the per-slice reviewer subagents.
# Model tiering (certified pins, sized from real run cost data 2026-07-26):
#   haiku  — structured, bounded outputs (gap-questions, data-design, screen-inventory)
#   sonnet — mainstream coding/extraction (ingest, agent-design, build-*, slice-audit)
#   opus   — reasoning + user-facing creative quality (requirements, architecture, design options)
# escalateModel: retries run one tier up with the failure feedback.
# See docs/DESIGN.md §7/§7b for the design rationale per node.
# v0.12.1: SECURITY BAKED INTO THE SUBSTRATE — generic /api/{table} is
# default-closed (data model must opt tables in); slice plans must include
# negative acceptance (refusal proofs); the security scan mechanically fails
# any slice-authored mutating route carrying no identity; live builds verify
# agents with LIVE calls (stub only for mock/certification determinism).
# v0.13.0: SELF-HEALING GATES — the strict Verification gates no longer STALL a
# build; they heal it. merge-slices runs the deterministic union first and, only
# on a genuine conflict, an agent resolves the conflicted hunks (both slices
# preserved). A new `remediate` node is the single app-hardening owner: it drives
# the security + usability gates against the merged app, FIXES unauthenticated
# mutations / dead controls / missing persona pickers / FSI gaps, and re-proves
# them green via its own `verify` — reusing the envelope's retry+escalation+
# feedback so a fixable defect is fixed, not fatal. The former standalone
# security-scan and verify-ui gates are folded into remediate (their reports are
# still emitted as governance evidence). Every fix is recorded as a lesson for
# the factory's build-expertise. Determinism holds: mocks replay the clean
# certified stub; live builds heal.
# v0.14.0: CORRECTNESS SHIFTED LEFT (from a live KYC build whose re-audit found
# 25 highs the happy-path acceptance missed). (1) Non-functional requirements are
# now first-class: requirements-synthesis derives authz/identity/gate/PII/audit
# requirements with testable refusal proofs, and slice-plan turns each into
# negative acceptance. (2) The two most dangerous, greppable classes are now
# DETERMINISTIC security-scan rules — fail-open identity (`find() or {role}`) and
# defaulted decisions (`get("decision","approved")`) — caught at build time,
# perfectly convergent. (3) The persistence substrate gained store.update/get so
# slices persist instead of mutating in memory. (4) slice-audit is pinned to Opus
# with an exhaustive fixed checklist so the audit converges (consistent depth =
# consistent findings) instead of 3 findings one pass and 25 the next. (5) merge
# is Opus. build-expertise rules 10-11 encode every class.
# v0.15.0: SHARED MODULES HARDENED (KYC v2 re-audit: 25→5 highs, 3 in shared
# modules). approval-flow persists decisions via store.update (no in-memory
# mutation) and resolves the gate actor through the app's identity (fail-closed,
# no bare-string identity); audit-log removed its forgeable public POST /audit
# (entries are server-side via record() only) and identity-gates GET /audit;
# build-expertise rule 12 covers the app-specific residue (export = a gated read;
# every terminal disposition enforces role+SoD, not just approve; the workflow
# gate needs the app's role check for parity).
# v0.15.1: PROCESS-LAYER MODULES HARDENED (KYC v3 re-audit: 5→4, all in the
# workflow/trigger modules). workflow-engine no longer prunes a merge node that
# has a completed branch (a human gate could be silently SKIPPED — the HITL
# control defeated); its start/tick resolve a real actor (no defaulted "system").
# approval-flow gates submit + the pending queue (case PII) behind identity. The
# audit now respects `# public-endpoint` process STARTERS (triggers/webhooks are
# intentionally public) and instead verifies the gates they lead to can't be
# skipped or decided by the starter.
# v0.16.0: THE AUDIT SELF-HEALS (KYC audit plateaued at ~4 subtle findings per
# pass — each remediation revealed the next layer). slice-audit is no longer a
# read-only report-and-block: it audits the merged app, FIXES every high finding,
# and re-audits to convergence, driven by its `verify` (check-audit-local) inside
# the envelope's retry loop — so the audit heals the app instead of stalling the
# build. It is now the final app-hardening owner; integration/coverage consume its
# healed app. Also: workflow-engine never skips a human gate via on_false branch
# short-circuit; the audit checklist adds revoked-persona-fails-closed and
# no-boolean-coerced-decision. A genuinely-accepted finding still needs a named
# waiver — the audit fixes by default, waives by exception.
# v0.17.0: GRAPH RIGOR. (1) Sub-graph templating: the parallel feature slices and
# their checkpoints are declared ONCE via a `repeat` construct the loader expands
# (proven byte-identical to the hand-written blocks). (2) Dynamic materialization:
# the slice pool is now driven by the plan (a slot activates only if slice_plan
# declares it, via `when`) and the ceiling lifted from a hard-coded 6 to 8 — the
# plan decides how many slices materialize. (3) The parallel merge declares a
# typed `reducer` (union-slices) instead of an implicit strategy. Existing
# scenarios replay byte-identical (extra slots skip).
name: agentic-app
version: 0.17.0
description: Builds a working agentic AI application from your problem statement and documents — requirements with provenance, approvable designs, certified modules, parallel feature-slice build with deterministic merge, self-healing security + usability remediation, tests, and governance evidence.

# Frontier concurrency: how many non-gate nodes may execute at once. Three
# keeps parallel slices (and the three design options) genuinely concurrent
# without saturating API limits. HARNESS_CONCURRENCY overrides per machine.
concurrency: 3

cost:
  # PHILOSOPHY: budgets are RUNAWAY GUARDS, not cost targets — set ~3x the
  # observed p95 so legitimate heavy work never stalls a build. The envelope
  # is the real spend control; finished work always commits (never shredded);
  # budgets only block STARTING further attempts.
  run_budget_usd: 150.00
  nodes:
    ingest: { budget_usd: 6.00 }
    requirements-synthesis: { budget_usd: 9.00 }
    gap-questions: { budget_usd: 3.00 }
    architecture: { budget_usd: 6.00 }
    screen-inventory: { budget_usd: 2.00 }
    design-option-1: { budget_usd: 12.00 }
    design-option-2: { budget_usd: 12.00 }
    design-option-3: { budget_usd: 12.00 }
    data-design: { budget_usd: 5.00 }
    agent-design: { budget_usd: 5.00 }
    workflow-design: { budget_usd: 6.00 }
    slice-plan: { budget_usd: 9.00 }
    slice-1: { budget_usd: 30.00 }
    slice-2: { budget_usd: 30.00 }
    slice-3: { budget_usd: 30.00 }
    slice-4: { budget_usd: 30.00 }
    slice-5: { budget_usd: 30.00 }
    slice-6: { budget_usd: 30.00 }
    slice-7: { budget_usd: 30.00 }
    slice-8: { budget_usd: 30.00 }
    merge-slices: { budget_usd: 20.00 }
    remediate: { budget_usd: 22.00 }
    slice-audit: { budget_usd: 16.00 }

interaction:
  max_questions_per_gate: 6

mcp:
  # The app-under-build as a managed service: slices probe cheaply instead of
  # paying a failed verification boot. Same boot contract as preview/verify.
  app-sandbox:
    server: "@harness/app-sandbox"
    config:
      boot: uv run --with fastapi --with uvicorn --with-requirements requirements.txt uvicorn dev:app --host 127.0.0.1 --port $PORT
      health: /health
      cwd: backend
      env: { HARNESS_AGENT_MODE: stub }

certification:
  # The feedback loop is part of the certified promise: after the golden run,
  # this change request must flow into requirements (with provenance), cascade,
  # and re-derive to green with memoization re-using untouched steps.
  revision_drill:
    node: requirements-synthesis
    feedback: "User change request CR-99: analysts must be able to see which agent produced each reply. Add this as a NEW requirement with provenance source \"user-feedback\" referencing CR-99, confidence \"stated\"."

# How the dashboard launches the built product for live preview.
preview:
  artifact: app
  command: uv run --with fastapi --with uvicorn --with-requirements requirements.txt uvicorn dev:app --host 127.0.0.1 --port $PORT
  cwd: backend
  health: /health

nodes:
  # -- Requirements (challenges a + b) --------------------------------------
  - id: intake
    phase: Requirements
    description: "Collects your problem statement, supporting documents, and key choices."
    kind: gate
    questions:
      - { id: project_name, prompt: "What should the application be called?", placeholder: "e.g. KYC Review Desk" }
      - id: problem_statement
        prompt: "Describe the problem this application should solve."
        type: long
        placeholder: "Who uses it, what they need to accomplish, the workflow stages, where AI agents should help, and which decisions must stay human. The richer this is, the fewer questions you'll be asked later."
      - id: documents_dir
        prompt: "Supporting documents (policies, specs, notes — any format)."
        type: files
        default: "none"
        why: "Everything you provide is read into an evidence corpus; requirements trace back to your documents instead of being invented."
      - id: deploy_target
        prompt: "Where should the finished app run?"
        type: choice
        default: "local"
        options:
          - { value: "local", label: "My machine", hint: "Run locally from the dashboard; no cloud stage." }
          - { value: "aws-apprunner", label: "AWS App Runner", hint: "Ships the app to AWS App Runner at a live HTTPS URL (fast path). Adds a certified deploy stage producing a reviewed plan." }
          - { value: "aws-ecs", label: "AWS ECS (Fargate, shared ALB)", hint: "Cost-optimal at scale — one shared load balancer, scale-to-zero per app. Adds a certified deploy stage producing a reviewed plan." }
          - { value: "cloud-run", label: "Google Cloud Run", hint: "Adds a certified deploy stage that produces a reviewed deploy plan." }
      - id: supervision
        prompt: "How closely do you want to supervise the build?"
        type: choice
        default: "every-slice"
        options:
          - { value: "every-slice", label: "Checkpoint every slice (recommended)", hint: "After each delivered feature: a short review window (90 seconds) with its evidence and screenshot. Answer to decide; walk away and it proceeds on approval-by-default, recorded as an assumption." }
          - { value: "gates-only", label: "Five decisions only", hint: "You're asked at intake, clarify, design pick, design review, and final sign-off. Slices build straight through with no pauses." }
      - id: agent_framework
        prompt: "Which framework should run the app's AI agent layer?"
        type: choice
        default: "standard"
        options:
          - { value: "standard", label: "Standard — portable (recommended)", hint: "Anthropic API, no framework lock-in. API-key-first, runs in any environment. Pick this unless your team standardizes on a specific framework." }
          - { value: "claude-sdk", label: "Claude Agent SDK", hint: "The Claude Agent SDK agentic loop (MCP tools, multi-turn). Runs via the API or the Claude CLI." }
          - { value: "langgraph", label: "LangGraph", hint: "A compiled LangGraph StateGraph runs every reply — for teams standardized on LangGraph." }
          - { value: "adk", label: "Google ADK", hint: "Google Agent Development Kit — an ADK LlmAgent/Runner executes every reply." }
    outputs:
      - { name: intake, file: intake.json, schema: schemas/intake.schema.json }

  - id: ingest
    phase: Requirements
    description: "Reads every document you provided and builds an evidence corpus — each claim tracked back to its source."
    kind: agent
    model: claude-sonnet-5
    escalateModel: claude-opus-5
    maxTurns: 40
    deps: [intake]
    prompt: prompts/ingest.md
    mock: node "$HARNESS_PROJECT_DIR/mocks/ingest.cjs"
    retries: 2
    outputs:
      - { name: corpus, file: corpus, dir: true }
      - { name: corpus_index, file: corpus_index.json, schema: schemas/corpus_index.schema.json }

  - id: requirements-synthesis
    phase: Requirements
    description: "Turns the evidence into requirements, each labeled stated / inferred / unknown with provenance."
    kind: agent
    model: claude-opus-5
    deps: [ingest, intake]
    prompt: prompts/requirements.md
    mock: node "$HARNESS_PROJECT_DIR/mocks/requirements.cjs"
    retries: 2
    outputs:
      - { name: requirements, file: requirements.json, schema: schemas/requirements.schema.json }

  - id: gap-questions
    phase: Requirements
    description: "Finds the few gaps that genuinely change the build and turns ONLY those into questions with sensible defaults."
    kind: agent
    model: claude-haiku-4-5
    escalateModel: claude-sonnet-5
    deps: [requirements-synthesis]
    prompt: prompts/gap-questions.md
    mock: node "$HARNESS_PROJECT_DIR/mocks/gap-questions.cjs"
    outputs:
      - { name: gaps, file: gaps.json, schema: schemas/gaps.schema.json }

  - id: clarify
    phase: Requirements
    description: "You answer the clarifying questions (or accept the defaults)."
    kind: gate
    deps: [gap-questions]
    questionsFrom: { artifact: gaps }
    outputs:
      - { name: clarifications, file: clarifications.json }

  # -- Architecture + budgets (challenge d) ---------------------------------
  - id: architecture
    phase: Design
    description: "Chooses certified modules for your app and plans the build budget."
    kind: agent
    model: claude-opus-5
    deps: [requirements-synthesis, clarify, intake]
    prompt: prompts/architecture.md
    mock: node "$HARNESS_PROJECT_DIR/mocks/architecture.cjs"
    outputs:
      - { name: architecture, file: architecture.json, schema: schemas/architecture.schema.json }

  - id: budget-check
    phase: Design
    description: "Verifies the build plan fits the certified cost envelope."
    kind: verifier
    deps: [architecture]
    command: node "$HARNESS_PROJECT_DIR/scripts/budget-check.cjs"

  # -- Design options (challenge c) -----------------------------------------
  # The shared screen inventory makes the three concurrent options COMPARABLE:
  # every option builds the same screens, so design-select is a real choice.
  - id: screen-inventory
    phase: Design
    description: "Derives the screen inventory every design option must cover — the shared contract that keeps concurrent options comparable."
    kind: agent
    model: claude-haiku-4-5
    escalateModel: claude-sonnet-5
    deps: [requirements-synthesis, intake]
    prompt: prompts/screen-inventory.md
    mock: node "$HARNESS_PROJECT_DIR/mocks/screen-inventory.cjs"
    retries: 2
    outputs:
      - { name: screen_inventory, file: screen_inventory.json, schema: schemas/screen_inventory.schema.json }

  # ONE enterprise-grade theme, presented as two LAYOUT variants (not three
  # different themes). Both are the same operational console — same color
  # tokens, typography, components — differing only in spatial layout, so the
  # choice is about ergonomics, not restyling. An enterprise console surfaces
  # the dashboard, live process instances, work queues, and human-in-the-loop
  # approvals as first-class regions.
  - id: design-option-1
    phase: Design
    description: "Layout A — enterprise operational console, left-rail navigation: dashboard, work queues, process timelines, and HITL approval panels."
    kind: agent
    model: claude-opus-5
    maxTurns: 45
    params: { option: 1, direction: "ENTERPRISE OPERATIONAL CONSOLE, LEFT-RAIL layout. A persistent left navigation rail; the main canvas leads with a dashboard (KPI cards + live process-instance cards), then dense work-queue data tables, a process timeline with per-step status chips (system / AI agent / human), and inline human-in-the-loop approval panels. Calm, professional, information-dense. Neutral slate palette, system sans-serif, subtle borders and status chips." }
    deps: [screen-inventory, requirements-synthesis, intake]
    prompt: prompts/design-option.md
    mock: node "$HARNESS_PROJECT_DIR/mocks/design-option.cjs"
    retries: 2
    outputs:
      - { name: option_1_dir, file: designs, dir: true }

  - id: design-option-2
    phase: Design
    description: "Layout B — same enterprise console theme, top-bar navigation with a master/detail split for process instances and records."
    kind: agent
    model: claude-opus-5
    maxTurns: 45
    params: { option: 2, direction: "SAME ENTERPRISE CONSOLE THEME as Layout A — identical color tokens, typography, and components — but a TOP-BAR navigation with a MASTER/DETAIL split: a list of process instances / records down the left of the working area, and on the right the selected item's detail, its process timeline with per-step status chips, and human-in-the-loop approval panels. Same dashboard KPI cards and data tables; different spatial arrangement only." }
    deps: [screen-inventory, requirements-synthesis, intake]
    prompt: prompts/design-option.md
    mock: node "$HARNESS_PROJECT_DIR/mocks/design-option.cjs"
    retries: 2
    outputs:
      - { name: option_2_dir, file: designs, dir: true }

  - id: design-assemble
    phase: Design
    description: "Collects the three concurrently-built design options into one comparable set with a verified index."
    kind: deterministic
    deps: [design-option-1, design-option-2]
    command: node "$HARNESS_PROJECT_DIR/scripts/design-assemble.cjs"
    outputs:
      - { name: designs_dir, file: designs, dir: true }
      - { name: designs, file: designs.json, schema: schemas/designs.schema.json }

  - id: design-check
    phase: Design
    description: "Verifies the design options are complete and comparable."
    kind: verifier
    deps: [design-assemble]
    command: node "$HARNESS_PROJECT_DIR/scripts/design-check.cjs"

  - id: design-select
    phase: Design
    description: "You pick the design direction for your app."
    kind: gate
    deps: [design-assemble, design-check]
    questions:
      - { id: chosen_option, prompt: "Which design option? (option-1 / option-2 / option-3)", default: "option-1", why: "Selected tokens configure the app shell." }
    outputs:
      - { name: design_choice, file: design_choice.json, schema: schemas/design_choice.schema.json }

  - id: design-contract
    phase: Design
    description: "Turns your chosen design into an enforceable promise: every screen and interactive element it contains, inventoried for delivery tracking — and every control checked to trace to a requirement (ungrounded 'furniture' is rejected before it can ship dead)."
    kind: deterministic
    deps: [design-select, design-assemble, requirements-synthesis]
    command: node "$HARNESS_PROJECT_DIR/scripts/design-contract.cjs"
    outputs:
      - { name: design_contract, file: design_contract.json, schema: schemas/design_contract.schema.json }

  # -- Detailed design -------------------------------------------------------
  - id: data-design
    phase: Design
    description: "Designs the data tables your app needs."
    kind: agent
    model: claude-haiku-4-5
    escalateModel: claude-sonnet-5
    deps: [requirements-synthesis]
    prompt: prompts/data-design.md
    mock: node "$HARNESS_PROJECT_DIR/mocks/data-design.cjs"
    outputs:
      - { name: data_model, file: data_model.json, schema: schemas/data_model.schema.json }

  - id: agent-design
    phase: Design
    description: "Sweeps every workflow step and requirement for agent opportunities — the roster plus an auditable map of every slot considered, included or rejected with reasons."
    kind: agent
    model: claude-opus-5
    deps: [requirements-synthesis, clarify, workflow-design]
    prompt: prompts/agent-design.md
    mock: node "$HARNESS_PROJECT_DIR/mocks/agent-design.cjs"
    outputs:
      - { name: agent_roster, file: agent_roster.json, schema: schemas/agent_roster.schema.json }

  # -- Traceability + confirmation (requirements FLOW into design; user confirms) --
  - id: workflow-design
    phase: Design
    description: "Derives the app's business processes as deterministic workflows with agentic nodes — the pipeline's own architecture, shipped into your app."
    kind: agent
    model: claude-opus-5
    deps: [requirements-synthesis, data-design]
    prompt: prompts/workflow-design.md
    mock: node "$HARNESS_PROJECT_DIR/mocks/workflow-design.cjs"
    retries: 2
    verify: node "$HARNESS_PROJECT_DIR/scripts/check-workflows.cjs"
    outputs:
      - { name: workflows, file: workflows.json, schema: schemas/workflows.schema.json }

  - id: traceability
    phase: Confirmation
    description: "Builds the requirements traceability matrix — proof that every requirement is addressed somewhere."
    kind: deterministic
    deps: [requirements-synthesis, architecture, data-design, agent-design, design-assemble, gap-questions, clarify, workflow-design]
    command: node "$HARNESS_PROJECT_DIR/scripts/traceability.cjs"
    outputs:
      - { name: rtm, file: rtm.json, schema: schemas/rtm.schema.json }

  - id: design-review
    phase: Confirmation
    description: "You confirm the requirements-to-design mapping and all assumptions before any build spend."
    kind: gate
    deps: [traceability, design-select, budget-check]
    questions:
      - { id: approve_design, prompt: "Review rtm.json (requirements -> design mapping + assumptions). Approve the design and start the build? (yes/no)", why: "Last checkpoint before build spend; confirms every requirement is addressed." }
    outputs:
      - { name: design_review, file: design_review.json, schema: schemas/design_review.schema.json }

  # -- Compose + build (challenge e) ----------------------------------------
  - id: scaffold
    phase: Build
    description: "Assembles the working skeleton: certified modules composed, your design applied, tests included. Zero AI cost."
    kind: deterministic
    deps: [architecture, design-review, design-select, design-assemble, data-design, agent-design, workflow-design, intake]
    command: node "$HARNESS_PROJECT_DIR/scripts/scaffold.cjs"
    outputs:
      - { name: app, file: app, dir: true }

  - id: slice-plan
    phase: Build
    description: "Plans the build as vertical slices — each one a user-visible feature delivered end to end, sized to fit one build attempt."
    kind: agent
    model: claude-opus-5
    deps: [requirements-synthesis, architecture, data-design, agent-design, workflow-design, design-review, design-contract]
    prompt: prompts/slice-plan.md
    mock: node "$HARNESS_PROJECT_DIR/mocks/slice-plan.cjs"
    verify: node "$HARNESS_PROJECT_DIR/scripts/check-slice-plan.cjs"
    outputs:
      - { name: slice_plan, file: slice_plan.json, schema: schemas/slice_plan.schema.json }

  # Slice 1 is the FOUNDATION: core plumbing plus its own covered screens,
  # verified cumulatively. Slices 2..6 then build CONCURRENTLY on top of it.
  - id: slice-1
    phase: Build
    description: "Builds the foundation slice across every layer, then proves it: acceptance checks and the test suite. Slices 2+ build on this in parallel."
    kind: agent
    model: claude-sonnet-5
    escalateModel: claude-opus-5
    maxTurns: 120
    retries: 2
    params: { slice: 1 }
    when: { artifact: slice_plan, path: "slices.0", exists: true }
    deps: [scaffold, slice-plan]
    allowedTools: [Read, Write, Edit, Bash, Glob, Grep, Skill,
                   mcp__app-sandbox__start_app, mcp__app-sandbox__request,
                   mcp__app-sandbox__logs, mcp__app-sandbox__run_tests,
                   mcp__app-sandbox__stop_app]
    mcp: [app-sandbox]
    skills: [app-conventions, workflow-authoring, fsi-hardening]
    prompt: prompts/build-slice.md
    mock: node "$HARNESS_PROJECT_DIR/mocks/build-slice.cjs"
    verify: node "$HARNESS_PROJECT_DIR/scripts/verify-slice.cjs"
    outputs:
      - { name: app, file: app, dir: true }

  # Slices 2..8 are the parallel build wave: ONE template, expanded per slice by
  # the loader's `repeat` (a slice activates only if slice_plan declares it, via
  # `when`). slice-1 (the foundation, serial) stays explicit above.
  - id: "slice-${n}"
    phase: Build
    description: "Builds feature slice ${n} on the foundation, in parallel with its sibling slices, then proves it: its acceptance checks, the foundation's, and the test suite."
    kind: agent
    model: claude-sonnet-5
    escalateModel: claude-opus-5
    maxTurns: 120
    retries: 2
    repeat: { var: n, from: 2, to: 8 }
    params: { slice: "${n}", parallel: true }
    when: { artifact: slice_plan, path: "slices.${n-1}", exists: true }
    deps: [slice-1, review-slice-1, slice-plan]
    allowedTools: [Read, Write, Edit, Bash, Glob, Grep, Skill,
                   mcp__app-sandbox__start_app, mcp__app-sandbox__request,
                   mcp__app-sandbox__logs, mcp__app-sandbox__run_tests,
                   mcp__app-sandbox__stop_app]
    mcp: [app-sandbox]
    skills: [app-conventions, workflow-authoring, fsi-hardening]
    prompt: prompts/build-slice.md
    mock: node "$HARNESS_PROJECT_DIR/mocks/build-slice.cjs"
    verify: node "$HARNESS_PROJECT_DIR/scripts/verify-slice.cjs"
    outputs:
      - { name: "app_${n}", file: app, dir: true }

  # -- Slice checkpoints (every-slice supervision) --------------------------
  # `when.all` keeps phantom checkpoints out: a review only exists when its
  # slice exists in the plan AND every-slice supervision was chosen.
  - id: review-slice-1
    phase: Build
    description: "Checkpoint: the foundation slice is delivered and verified — you approve it (or request changes) before the parallel build wave starts."
    kind: gate
    window: 90
    when:
      all:
        - { artifact: intake, path: supervision, equals: "every-slice" }
        - { artifact: slice_plan, path: "slices.0", exists: true }
    deps: [slice-1]
    questions:
      - { id: verdict, prompt: "Slice 1 is delivered and verified — continue the build?", type: boolean, default: "yes", why: "Your checkpoint. Review its screenshot and evidence first; use Request changes on the slice if you want it revised before continuing." }
    outputs:
      - { name: review_slice_1, file: review.json }

  # Slice checkpoints 2..8 — one template (review-slice-1 is explicit above).
  - id: "review-slice-${n}"
    phase: Build
    description: "Checkpoint: slice ${n} is delivered and verified — you approve it (or request changes) before the merge."
    kind: gate
    window: 90
    repeat: { var: n, from: 2, to: 8 }
    when:
      all:
        - { artifact: intake, path: supervision, equals: "every-slice" }
        - { artifact: slice_plan, path: "slices.${n-1}", exists: true }
    deps: ["slice-${n}"]
    questions:
      - { id: verdict, prompt: "Slice ${n} is delivered and verified — continue the build?", type: boolean, default: "yes", why: "Your checkpoint. Review its screenshot and evidence first; use Request changes on the slice if you want it revised before continuing." }
    outputs:
      - { name: "review_slice_${n}", file: review.json }

  # -- Deterministic merge of the parallel slice wave -----------------------
  - id: merge-slices
    phase: Build
    description: "Unions the parallel slices into one app — a DETERMINISTIC line-level three-way merge against the foundation (additive conflicts auto-resolved) runs first; on the rare genuine conflict a healing agent resolves ONLY the conflicted hunks (preserving both slices) so the build never stalls, and records the lesson. Then re-proves EVERY slice's acceptance cumulatively."
    kind: agent
    # The parallel fan-in strategy, declared and load-validated (not implicit):
    # a deterministic three-way union with additive-conflict auto-resolution.
    reducer: union-slices
    # Conflict resolution is real reasoning — a weaker model rabbit-holes into
    # byte-level forensics and exhausts its turns. Opus resolves the union
    # directly. (Verified on a live build: haiku/sonnet burned 40 turns
    # inspecting UTF-8/newline bytes; Opus is the cost-correct choice here.)
    model: claude-opus-5
    maxTurns: 50
    retries: 2
    deps: [slice-1, slice-2, slice-3, slice-4, slice-5, slice-6, slice-7, slice-8,
           review-slice-1, review-slice-2, review-slice-3, review-slice-4, review-slice-5, review-slice-6, review-slice-7, review-slice-8,
           slice-plan]
    allowedTools: [Read, Write, Edit, Bash, Glob, Grep]
    prompt: prompts/heal-merge.md
    mock: node "$HARNESS_PROJECT_DIR/mocks/merge-slices.cjs"
    verify: node "$HARNESS_PROJECT_DIR/scripts/verify-merged.cjs"
    outputs:
      - { name: app, file: app, dir: true }
      - { name: merge_remediation, file: remediation.json }

  # -- Self-healing remediation (make the merged app secure + usable) --------
  # The single app-hardening owner of the Verification phase: it drives the
  # deterministic security + usability gates against the merged app, FIXES every
  # finding (unauthenticated mutations, dead controls, missing persona picker,
  # FSI hardening gaps), and records the lesson — so a defect heals instead of
  # stalling the build. Its `verify` re-runs the SAME gates: work commits only
  # once they are green, so a residual dead control or open mutation comes back
  # as feedback and the node retries (escalating the model). Every downstream
  # verifier consumes THIS hardened app. Live builds only heal; the mock replays
  # the already-clean certified stub deterministically.
  - id: remediate
    phase: Verification
    description: "Hardens the merged app to the 'done' bar: drives the security scan and the usability drive, fixes unauthenticated mutations and dead controls, ensures an identity-gated app ships a persona picker, and re-proves them green — self-healing, so a fixable defect never stalls the build. Documents each fix as a lesson."
    kind: agent
    model: claude-haiku-4-5
    escalateModel: claude-sonnet-5
    maxTurns: 80
    retries: 2
    deps: [merge-slices, slice-plan, requirements-synthesis, design-contract]
    allowedTools: [Read, Write, Edit, Bash, Glob, Grep]
    prompt: prompts/remediate.md
    mock: node "$HARNESS_PROJECT_DIR/mocks/remediate.cjs"
    verify: node "$HARNESS_PROJECT_DIR/scripts/check-remediation.cjs"
    outputs:
      - { name: app, file: app, dir: true }
      - { name: remediation, file: remediation.json }
      - { name: security_report, file: security_report.json, schema: schemas/security_report.schema.json }
      - { name: ui_interactivity, file: ui_interactivity.json }

  # -- Validate + secure (challenges e + f) ---------------------------------
  # SELF-HEALING semantic audit: the final app-hardening owner. It audits the
  # merged app on harness contracts + FSI hardening, FIXES every high finding it
  # finds, and re-audits to convergence — the audit no longer just reports-and-
  # blocks, it heals. Pinned to Opus (a semantic authz/correctness review: a
  # shallow pass finds 3 holes where a thorough one finds 25 — consistent depth =
  # convergence). Its `verify` re-checks the healed app's audit.json and fails on
  # any unwaived high, so the envelope's retry loop drives audit→fix→re-audit
  # until clean. Downstream integration/coverage/governance consume THIS healed app.
  - id: slice-audit
    phase: Verification
    description: "Self-healing semantic audit: audits the merged app (design fidelity, route shadowing, module bypasses; FSI hardening — authz, human gates, real persistence, trustworthy audit, decision integrity), FIXES every high finding, and re-audits to convergence. The audit heals the app rather than stalling the build on a finding; a genuinely-accepted finding needs a named waiver."
    kind: agent
    model: claude-opus-5
    maxTurns: 80
    retries: 3
    deps: [remediate, slice-plan]
    allowedTools: [Read, Write, Edit, Bash, Glob, Grep]
    prompt: prompts/slice-audit.md
    mock: node "$HARNESS_PROJECT_DIR/mocks/slice-audit.cjs"
    verify: node "$HARNESS_PROJECT_DIR/scripts/check-audit-local.cjs"
    outputs:
      - { name: app, file: app, dir: true }
      - { name: audit, file: audit.json, schema: schemas/audit.schema.json }

  - id: audit-check
    phase: Verification
    description: "The code audit is a GATE, not advice: any unwaived high-severity finding (semantic authz, human-gate, or financial-integrity defect a regex scan cannot catch) blocks the build until fixed or a named human waives it."
    kind: verifier
    deps: [slice-audit]
    command: node "$HARNESS_PROJECT_DIR/scripts/audit-check.cjs"
    outputs:
      - { name: audit_gate, file: audit_gate.json }

  - id: integrate
    phase: Verification
    description: "Runs the whole hardened + audited app: full test suite, agent evals, and container boot smoke."
    kind: verifier
    deps: [slice-audit]
    command: node "$HARNESS_PROJECT_DIR/scripts/verify-integrate.cjs"
    outputs:
      - { name: integration_report, file: integration_report.json, schema: schemas/integration_report.schema.json }

  - id: design-coverage
    phase: Verification
    description: "Proves design delivery: boots the finished app, visits every screen you approved, verifies its elements exist, and screenshots each one live. An approved screen missing from the app fails the build."
    kind: deterministic
    deps: [slice-audit, integrate, design-contract, slice-plan]
    command: node "$HARNESS_PROJECT_DIR/scripts/design-coverage.cjs"
    outputs:
      - { name: design_coverage, file: design_coverage.json, schema: schemas/design_coverage.schema.json }
      - { name: coverage_shots, file: coverage, dir: true }

  # NOTE: the security scan and the UI-usability drive that used to live here as
  # standalone gates are now DRIVEN AND SELF-HEALED inside `remediate` (and
  # re-proven by its `verify`). remediate emits their reports as artifacts
  # (security_report.json, ui_interactivity.json), so a dead control or an
  # unauthenticated mutation is FIXED rather than fatal — while still never
  # shipping unproven, since remediate commits only once both gates pass.

  - id: governance-report
    phase: Verification
    description: "Generates the evidence pack: tests, evals, security, code audit, requirement coverage, and the functional-validation proof (a real browser drove every screen and control) — all with evidence."
    kind: deterministic
    deps: [remediate, integrate, agent-design, traceability, slice-audit, audit-check, design-coverage]
    command: node "$HARNESS_PROJECT_DIR/scripts/governance.cjs"
    outputs:
      - { name: governance, file: governance.json, schema: schemas/governance.schema.json }

  - id: uat
    phase: Ship
    description: "You exercise the app and give final approval."
    kind: gate
    deps: [governance-report, design-coverage]
    questions:
      - { id: approved, prompt: "You have exercised the app and reviewed the evidence pack. Approve for release?", type: boolean }
    outputs:
      - { name: uat, file: uat.json, schema: schemas/uat.schema.json }

  # -- Optional deploy (conditional) ----------------------------------------
  - id: deploy
    phase: Ship
    description: "Produces the Cloud Run deploy plan (only when you chose cloud deployment)."
    kind: deterministic
    deps: [uat, architecture]
    when: { artifact: architecture, path: deploy_target, in: [cloud-run, aws-apprunner, aws-ecs] }
    command: node "$HARNESS_PROJECT_DIR/scripts/deploy-plan.cjs"
    outputs:
      - { name: deploy_plan, file: deploy, dir: true }
