name: agent-runtime-strands
version: 0.1.0
description: "The agent-runtime contract implemented on AWS Strands — a Strands Agent with a custom Model bridge executes every reply; the model behind it is stub/live-cli/live-api like the base runtime."
provides:
  - "python: agent_runtime.respond/mode/_roster — identical contract to the base runtime, executed through an AWS Strands Agent"
requires:
  - "persistence-core"
conflicts:
  - "agent-runtime"
  - "agent-runtime-langgraph"
  - "agent-runtime-adk"
app_deps:
  - "strands-agents>=1"
  - "cryptography<49"
compose:
  overlay: compose/
certify:
  tests: test/
  python_deps: ["strands-agents>=1", "cryptography<49"]
