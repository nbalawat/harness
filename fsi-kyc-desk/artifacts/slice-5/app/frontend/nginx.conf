server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location = /chat {
        proxy_pass http://backend:8000/chat;
    }
    location /api/ {
        proxy_pass http://backend:8000/api/;
    }
    location /agent/ {
        proxy_pass http://backend:8000/agent/;
    }
    location = /agents {
        proxy_pass http://backend:8000/agents;
    }
    # Exact + trailing-slash forms only. A bare `location /cases` is an nginx
    # PREFIX match and would also swallow `/cases.js`, proxying the slice's own
    # script to the backend (404) and killing the UI under docker-compose.
    location = /checklist {
        proxy_pass http://backend:8000/checklist;
    }
    location = /cases {
        proxy_pass http://backend:8000/cases;
    }
    location /cases/ {
        proxy_pass http://backend:8000/cases/;
    }
    location = /audit {
        proxy_pass http://backend:8000/audit;
    }
    location /audit/ {
        proxy_pass http://backend:8000/audit/;
    }
    location = /risk-matrix {
        proxy_pass http://backend:8000/risk-matrix;
    }
    location /risk/ {
        proxy_pass http://backend:8000/risk/;
    }
    # Slice 3 — memo drafting and citation resolution. Prefix forms only:
    # there is no memos.js/citations.js static asset, so no shadowing risk,
    # but exact + prefix is kept consistent with the rest of this file.
    location = /policy-corpus {
        proxy_pass http://backend:8000/policy-corpus;
    }
    location /memos/ {
        proxy_pass http://backend:8000/memos/;
    }
    location /citations/ {
        proxy_pass http://backend:8000/citations/;
    }
    # Slice 4 — RBAC and tiered human approval. Exact forms only: none of
    # these paths have sub-resources, so an nginx exact `location =` can
    # never swallow a sibling static asset the way a bare prefix match did
    # for /cases in slice 1 (see that note above) — this holds even though
    # frontend/decisions.js *does* exist, because `= /decisions` matches only
    # the literal path "/decisions", never "/decisions.js".
    location = /roles {
        proxy_pass http://backend:8000/roles;
    }
    location = /users {
        proxy_pass http://backend:8000/users;
    }
    location = /decisions {
        proxy_pass http://backend:8000/decisions;
    }
    location = /notifications {
        proxy_pass http://backend:8000/notifications;
    }
    # Slice 5 — SLA clocks, at-risk flags and the escalation chain. Exact
    # location for /sla-policy (no sub-resources); /sla/ as a prefix for
    # /sla/evaluate. No shadowing risk either way — there is no sla-policy.js
    # or sla-evaluate.js static asset, only the single frontend/sla.js this
    # slice adds (matched by its own literal filename, never by these).
    location = /sla-policy {
        proxy_pass http://backend:8000/sla-policy;
    }
    location /sla/ {
        proxy_pass http://backend:8000/sla/;
    }
    location = /escalations {
        proxy_pass http://backend:8000/escalations;
    }
}
