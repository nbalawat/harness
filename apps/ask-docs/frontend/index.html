<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Ask Docs — Northwind Handbook Assistant</title>
<style>
  :root{
    --bg:#0f1115; --panel:#171a21; --panel2:#1e222b; --border:#2a2f3a;
    --fg:#e7eaf0; --muted:#9aa3b2; --accent:#5b8cff; --accent2:#7aa2ff;
    --user:#264b8f; --ok:#3fb37f; --radius:14px; --font:'Inter',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  }
  @media (prefers-color-scheme: light){
    :root{ --bg:#f4f6fb; --panel:#ffffff; --panel2:#f0f3f9; --border:#e2e7f0; --fg:#141821; --muted:#5c6675; --user:#dbe6ff; }
    .msg.user .bubble{ color:#0b1b3a; }
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:var(--font);background:var(--bg);color:var(--fg);height:100vh;display:flex;flex-direction:column}
  header{display:flex;align-items:center;gap:.7rem;padding:.85rem 1.2rem;border-bottom:1px solid var(--border);background:var(--panel)}
  .logo{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:grid;place-items:center;font-weight:800;color:#fff;font-size:.95rem}
  header h1{font-size:1.02rem;margin:0;font-weight:650;letter-spacing:.01em}
  header .sub{color:var(--muted);font-size:.78rem;margin-left:.1rem}
  .mode{margin-left:auto;font-size:.72rem;color:var(--muted);display:flex;align-items:center;gap:.4rem;padding:.3rem .6rem;border:1px solid var(--border);border-radius:999px}
  .mode .dot{width:7px;height:7px;border-radius:50%;background:var(--ok)}
  .wrap{flex:1;display:grid;grid-template-columns:1fr 300px;min-height:0}
  main{display:flex;flex-direction:column;min-height:0}
  #thread{flex:1;overflow-y:auto;padding:1.4rem clamp(1rem,6vw,4rem);display:flex;flex-direction:column;gap:1.1rem}
  .empty{margin:auto;max-width:520px;text-align:center;color:var(--muted)}
  .empty h2{color:var(--fg);font-weight:650;margin:.2rem 0 .4rem;font-size:1.25rem}
  .chips{display:flex;flex-wrap:wrap;gap:.5rem;justify-content:center;margin-top:1.1rem}
  .chip{padding:.5rem .8rem;border:1px solid var(--border);border-radius:999px;background:var(--panel);color:var(--fg);font-size:.82rem;cursor:pointer;transition:.15s}
  .chip:hover{border-color:var(--accent);color:var(--accent2)}
  .msg{display:flex;gap:.7rem;max-width:760px}
  .msg.user{align-self:flex-end;flex-direction:row-reverse}
  .avatar{width:30px;height:30px;border-radius:8px;flex-shrink:0;display:grid;place-items:center;font-size:.75rem;font-weight:700}
  .msg.assistant .avatar{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff}
  .msg.user .avatar{background:var(--user);color:var(--fg)}
  .bubble{padding:.7rem .95rem;border-radius:var(--radius);line-height:1.55;font-size:.95rem}
  .msg.assistant .bubble{background:var(--panel);border:1px solid var(--border);border-top-left-radius:4px}
  .msg.user .bubble{background:var(--user);border-top-right-radius:4px}
  .sources{display:flex;flex-wrap:wrap;gap:.4rem;margin-top:.6rem}
  .src{font-size:.72rem;color:var(--muted);border:1px solid var(--border);border-radius:6px;padding:.15rem .5rem;background:var(--panel2)}
  .src b{color:var(--accent2);font-weight:600}
  .typing{display:flex;gap:.3rem;padding:.3rem 0}
  .typing span{width:7px;height:7px;border-radius:50%;background:var(--muted);animation:blink 1.2s infinite both}
  .typing span:nth-child(2){animation-delay:.2s}.typing span:nth-child(3){animation-delay:.4s}
  @keyframes blink{0%,80%,100%{opacity:.25}40%{opacity:1}}
  form{display:flex;gap:.6rem;padding:1rem clamp(1rem,6vw,4rem) 1.3rem;border-top:1px solid var(--border);background:var(--panel)}
  #input{flex:1;padding:.85rem 1rem;border:1px solid var(--border);border-radius:12px;background:var(--bg);color:var(--fg);font:inherit;resize:none;max-height:140px}
  #input:focus{outline:none;border-color:var(--accent)}
  button.send{padding:0 1.3rem;border:0;border-radius:12px;background:var(--accent);color:#fff;font-weight:600;cursor:pointer;font-size:.92rem}
  button.send:disabled{opacity:.5;cursor:not-allowed}
  aside{border-left:1px solid var(--border);background:var(--panel);overflow-y:auto;padding:1rem}
  aside h3{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:.2rem 0 .7rem}
  .hist{padding:.6rem .7rem;border:1px solid var(--border);border-radius:10px;margin-bottom:.55rem;cursor:pointer;transition:.15s}
  .hist:hover{border-color:var(--accent)}
  .hist .q{font-size:.85rem;font-weight:550;margin-bottom:.2rem}
  .hist .a{font-size:.78rem;color:var(--muted);overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
  .hist-empty{color:var(--muted);font-size:.82rem}
  @media(max-width:820px){.wrap{grid-template-columns:1fr}aside{display:none}}
</style>
</head>
<body>
  <header>
    <div class="logo">ND</div>
    <div><h1>Ask Docs</h1><span class="sub">Northwind employee handbook</span></div>
    <div class="mode"><span class="dot"></span><span id="mode">connecting…</span></div>
  </header>
  <div class="wrap">
    <main>
      <div id="thread">
        <div class="empty" id="empty">
          <div class="logo" style="width:44px;height:44px;margin:0 auto;font-size:1.2rem">ND</div>
          <h2>Ask anything about working at Northwind</h2>
          <div>Grounded answers from the employee handbook, with sources. Try:</div>
          <div class="chips" id="chips"></div>
        </div>
      </div>
      <form id="composer">
        <textarea id="input" rows="1" placeholder="Ask about PTO, benefits, remote work…" autocomplete="off"></textarea>
        <button class="send" id="send" type="submit">Ask</button>
      </form>
    </main>
    <aside>
      <h3>Recent questions</h3>
      <div id="history"><div class="hist-empty">Your questions will appear here.</div></div>
    </aside>
  </div>
  <script src="app.js" defer></script>
</body>
</html>
