name: audit-view
version: 0.1.0
description: "The uniform 'history' panel over audit-log/row-history — one way to read what happened."
provides:
  - "js: HarnessAudit.formatEntry(entry) pure; render(el, entries) newest first"
requires:
  - "audit-log"
compose:
  overlay: compose/
certify:
  command: node --check "$HARNESS_MODULE_DIR/compose/frontend/mod_auditview.js" && ! grep -q ".innerHTML =" "$HARNESS_MODULE_DIR/compose/frontend/mod_auditview.js" && node "$HARNESS_MODULE_DIR/test/test.mjs"
