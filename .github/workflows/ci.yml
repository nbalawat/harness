# Regression + certification gate: every change must pass the full suite AND
# re-certify every project type against its recorded goldens (byte-level
# artifact digests, cost envelopes, revision drill). Drift = red.
name: ci
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: astral-sh/setup-uv@v5
      - run: npm ci
      - run: npm test
      - name: certify mcp servers
        run: node packages/cli/dist/index.js certify-mcp
      - name: certify modules
        run: node packages/cli/dist/index.js certify-modules
      - name: certify demo-pipeline
        run: node packages/cli/dist/index.js certify project-types/demo
      - name: certify agentic-app
        run: node packages/cli/dist/index.js certify project-types/agentic-app
      - name: bundle
        run: npm run bundle
